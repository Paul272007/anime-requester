<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Requester</title>
    <link rel="icon" type="image/png" href="./goat-transparent.png" />
    <script type="importmap">
      {
        "imports": {
          "axios": "https://cdn.jsdelivr.net/npm/axios@1.7.9/+esm"
        }
      }
    </script>
    <script type="module" src="./js/searchController.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>Anime requester</h1>
      <button
        type="button"
        id="theme-toggle"
        class="btn-theme-toggle"
        aria-label="Activer le thème sombre"
        aria-pressed="false"
        title="Basculer entre le thème clair et sombre"
      >
        🌙
      </button>
    </header>
    <main>
      <form class="search-form" id="search-form" method="get">
        <div class="form-group has-help">
          <label for="api-key">Clé RapidAPI (optionnelle) :</label>
          <div class="form-control-wrapper">
            <div class="input-password-wrapper">
              <input
                id="api-key"
                type="password"
                name="api-key"
                placeholder="Laisser vide pour utiliser la clé par défaut"
                autocomplete="off"
                aria-describedby="api-key-help"
              />
              <button
                type="button"
                id="toggle-api-key"
                class="btn-toggle-password"
                aria-label="Afficher ou masquer la clé API"
                aria-pressed="false"
                title="Afficher ou masquer la clé API"
              >
                👁
              </button>
            </div>
            <small id="api-key-help" class="form-help">
              Une clé par défaut est utilisée automatiquement si vous ne
              renseignez pas la vôtre.
            </small>
          </div>
        </div>
        <div class="form-group">
          <label for="search-type">Choisissez un type de recherche : </label>
          <select name="type" id="search-type">
            <option value="titre">Recherche par titre</option>
            <option value="id">Recherche par identifiant</option>
            <option value="classement">Recherche par classement</option>
            <option value="genre">Recherche par genre</option>
            <option value="auteur">Recherche par auteur</option>
            <option value="annee">Recherche par année de sortie</option>
          </select>
        </div>
        <div class="form-group">
          <label for="parametre">Paramètre :</label>
          <input id="parametre" type="search" name="parametre" value="" />
        </div>
        <fieldset class="form-group genre-fieldset" id="genre-fieldset">
          <legend class="genre-legend">Genres (optionnel) :</legend>
          <div class="genre-options">
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Action" />
              <span>Action</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Adventure" />
              <span>Aventure</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Comedy" />
              <span>Comédie</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Drama" />
              <span>Drame</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Fantasy" />
              <span>Fantaisie</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Horror" />
              <span>Horreur</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Mystery" />
              <span>Mystère</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Romance" />
              <span>Romance</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Sci-Fi" />
              <span>Sci-Fi</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Slice of Life" />
              <span>Tranche de vie</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Sports" />
              <span>Sports</span>
            </label>
            <label class="genre-option">
              <input type="checkbox" name="genres" value="Supernatural" />
              <span>Surnaturel</span>
            </label>
          </div>
        </fieldset>

        <div class="form-action">
          <button type="submit">Rechercher</button>
          <button type="reset">Effacer</button>
        </div>
      </form>
      <section
        class="result-container"
        id="result-container"
        aria-live="polite"
        aria-busy="false"
        aria-label="Résultats de recherche"
      ></section>
    </main>

    <footer>
      <p>Copyright (c) 2026 neuille.com . All Rights Reserved.</p>
      <p>License: MIT License</p>
    </footer>
  </body>
</html>
